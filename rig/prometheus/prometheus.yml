global:
  scrape_interval: 15s
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - deployment.environment.name
    - telemetry.sdk.name
    - telemetry.sdk.language
  translation_strategy: UnderscoreEscapingWithSuffixes
storage:
  tsdb:
    out_of_order_time_window: 30m
scrape_configs:
  - job_name: otelcol
    static_configs:
      - targets: ["otelcol:8888"]
